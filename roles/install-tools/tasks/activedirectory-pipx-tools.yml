---
- name: "Install pipx tools"
  community.general.pipx:
    name: "{{ item.name }}"
    source: "{{ item.url }}"
    state: latest
  loop:
    - { name: 'impacket', url: 'git+https://github.com/fortra/impacket.git' }
    - { name: 'NetExec', url: 'git+https://github.com/Pennyw0rth/NetExec' }
    - { name: 'certipy-ad', url: 'git+https://github.com/ly4k/Certipy.git' }
    - { name: 'bloodhound', url: 'git+https://github.com/dirkjanm/BloodHound.py.git' }
    - { name: 'adidnsdump', url: 'git+https://github.com/dirkjanm/adidnsdump' }
    - { name: 'bloodyAD', url: 'git+https://github.com/CravateRouge/bloodyAD' }
    - { name: 'Coercer', url: 'git+https://github.com/p0dalirius/Coercer.git' }
    - { name: 'dnschef', url: 'git+https://github.com/byt3bl33d3r/dnschef-ng' }
    - { name: 'evil-jea', url: 'git+https://github.com/sashathomas/evil-jea' }
    - { name: 'git-dumper', url: 'git+https://github.com/arthaud/git-dumper' }
    - { name: 'powerview', url: 'git+https://github.com/aniqfakhrul/powerview.py' }
    - { name: 'sccmhunter', url: 'git+https://github.com/garrettfoster13/sccmhunter' }
    - { name: 'ldapsearch-ad', url: 'git+https://github.com/yaap7/ldapsearch-ad'}
    - { name: 'dploot', url: 'git+https://github.com/zblurx/dploot.git'}
    - { name: 'DonPAPI', url: 'git+https://github.com/login-securite/DonPAPI.git'}
    - { name: 'pypykatz', url: 'git+https://github.com/skelsec/pypykatz.git'}
    - { name: 'exrex', url: 'git+https://github.com/asciimoo/exrex.git'}
    - { name: 'pipx4adtools', url: 'git+https://github.com/manesec/pipx4adtools' }
    - { name: 'pipx4adtools', url: 'git+https://github.com/manesec/pipx4adtools@relay-sccm' }

